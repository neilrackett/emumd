; mdfw.ini - how EmuMD builds this firmware for the host (mdfw build).
; Paths are relative to this file; globs such as src/*.c are fine.

[firmware]
name = Wi-Fi
version = v1.0.0

[sources]
files =
    firmware/*.c
    emu/mdfw_app.c

[compile]
include =
    firmware              ; has lwipopts.h
    cart
cflags = -O2

[wifi]
; lwIP 2.2.1 (the Pico SDK's), downloaded once; a firmware would name its
; own: lwip = pico-sdk/lib/lwip
apps = http/http_client.c

[run]
machine = ste
; options = url=http://10.0.2.2:8000/  ; default: detectportal.firefox.com/success.txt
