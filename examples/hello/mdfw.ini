; mdfw.ini - how EmuMD builds this firmware for the host (mdfw build).
; Paths are relative to this file; globs such as src/*.c are fine.

[firmware]
name = Hello
version = v1.0.0

[sources]
; The firmware's logic, plus the glue. A real firmware would leave out its
; main.c and whatever sets up PIO, DMA, clocks and the SD card.
files =
    firmware/*.c
    emu/mdfw_app.c

[compile]
include =
    firmware
    cart
cflags = -O2

[run]
machine = ste
